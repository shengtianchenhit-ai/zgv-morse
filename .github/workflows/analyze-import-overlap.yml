name: Analyze import overlap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare uploaded project with related repositories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/partial
          cat .bootstrap/part-* > /tmp/partial-core.tar.xz
          set +e
          xz -dc /tmp/partial-core.tar.xz | tar -xf - -C /tmp/partial
          set -e

          candidates=(
            zgv-green
            zgv-EP2s
            zgv-viscoelastic-
            valley-zgv
            mth-zgv-collisions
            lame-thickness-crystals
            graded-laminate-zgv-design
            zgv-thermo
          )
          : > /tmp/blob-index.tsv
          for repo in "${candidates[@]}"; do
            echo "Cloning $repo"
            git clone --depth 1 --quiet "https://github.com/shengtianchenhit-ai/${repo}.git" "/tmp/${repo}"
            git -C "/tmp/${repo}" ls-tree -r HEAD \
              | awk -v repo="$repo" '{print $3 "\t" repo "\t" $4}' \
              >> /tmp/blob-index.tsv
          done
          sort -k1,1 /tmp/blob-index.tsv -o /tmp/blob-index.tsv

          : > /tmp/missing.tsv
          : > /tmp/sources.tsv
          matched=0
          missing=0
          while IFS=$'\t' read -r expected path; do
            partial="/tmp/partial/zgv-morse-paper/${path}"
            if [[ -f "$partial" ]] && [[ "$(git hash-object "$partial")" == "$expected" ]]; then
              printf '%s\tpartial-upload\t%s\n' "$path" "$path" >> /tmp/sources.tsv
              matched=$((matched + 1))
              continue
            fi
            hit="$(awk -F $'\t' -v sha="$expected" '$1 == sha {print $2 "\t" $3; exit}' /tmp/blob-index.tsv)"
            if [[ -n "$hit" ]]; then
              printf '%s\t%s\n' "$path" "$hit" >> /tmp/sources.tsv
              matched=$((matched + 1))
            else
              printf '%s\t%s\n' "$expected" "$path" >> /tmp/missing.tsv
              missing=$((missing + 1))
            fi
          done < .bootstrap/core-git-manifest.tsv

          printf 'MATCHED=%s\nMISSING=%s\n' "$matched" "$missing" > /tmp/overlap-summary.txt
          echo "MATCHED=${matched}"
          echo "MISSING=${missing}"
          echo "SOURCE_COUNTS"
          cut -f2 /tmp/sources.tsv | sort | uniq -c | sort -nr
          echo "MISSING_FILES_BEGIN"
          cat /tmp/missing.tsv
          echo "MISSING_FILES_END"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-overlap-report
          path: |
            /tmp/missing.tsv
            /tmp/sources.tsv
            /tmp/overlap-summary.txt
          if-no-files-found: warn

      - name: Persist comparison report
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bootstrap/analysis
          cp /tmp/missing.tsv .bootstrap/analysis/missing.tsv
          cp /tmp/sources.tsv .bootstrap/analysis/sources.tsv
          cp /tmp/overlap-summary.txt .bootstrap/analysis/summary.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .bootstrap/analysis
          git commit -m "Record import overlap analysis" || exit 0
          git push
