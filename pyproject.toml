[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zgv-morse"
version = "0.1.0"
description = "Computational study of a weakly anisotropic Lamb-wave ZGV critical ring"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9,<4",
    "mpmath>=1.3,<2",
    "numpy>=1.26,<3",
    "pypdf>=5,<7",
    "PyYAML>=6,<7",
    "scipy>=1.13,<2",
    "sympy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pybtex>=0.24,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zgv_morse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["slow: convergence and full-wave validation tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
